services:
  postgres:
    image: postgres:18-alpine

    environment:
      POSTGRES_DB: logija
      POSTGRES_USER: logija
      POSTGRES_PASSWORD: logija

    command:
      - "postgres"
      - "-c"
      - "shared_buffers=384MB"
      - "-c"
      - "work_mem=64MB"
      - "-c"
      - "maintenance_work_mem=128MB"
      - "-c"
      - "wal_buffers=32MB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "checkpoint_timeout=30min"
      - "-c"
      - "max_wal_size=4GB"
      - "-c"
      - "min_wal_size=512MB"
      - "-c"
      - "synchronous_commit=off"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_cache_size=768MB"
      - "-c"
      - "max_connections=120"
      - "-c"
      - "gin_pending_list_limit=64MB"

    volumes:
      - postgres_data:/var/lib/postgresql

    ports:
      - "5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logija -d logija"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    cpus: "1.0"
    mem_limit: 1g

  app:
    build: .

    ports:
      - "8080:8080"

    environment:
      NODE_ENV: production
      HOST: "0.0.0.0"
      PORT: "8080"
      LOG_LEVEL: warn
      DATABASE_URL: ${DATABASE_URL:-postgresql://logija:logija@postgres:5432/logija}
      CURSOR_SECRET: logija-local-cursor-secret
      DB_POOL_MAX: ${DB_POOL_MAX:-30}
      INGEST_STRATEGY: ${INGEST_STRATEGY:-unnest}
      INGEST_BATCH_MAX_LOGS: "3000"
      INGEST_BATCH_WAIT_MS: "2"
      INGEST_BATCH_CONCURRENCY: "6"
      RETENTION_DAYS: "30"
      RETENTION_INTERVAL_SECONDS: "60"
      RETENTION_BATCH_SIZE: "10000"
      RETENTION_MAX_BATCHES_PER_CYCLE: "10"

    depends_on:
      postgres:
        condition: service_healthy

    restart: unless-stopped

    cpus: "0.5"
    mem_limit: 256m

volumes:
  postgres_data:
